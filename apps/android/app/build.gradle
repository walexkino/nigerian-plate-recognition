plugins { id 'com.android.application' }
// Clean public checkouts remain usable as guest builds without project configuration.
if (file('google-services.json').exists() && !project.hasProperty('platelabGuestBuild')) { apply plugin: 'com.google.gms.google-services' }
android {
    namespace 'com.akinwale.platelab'
    compileSdk 36
    defaultConfig {
        applicationId 'com.akinwale.platelab'
        minSdk 23
        targetSdk 36
        versionCode 8
        versionName '0.7.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    // Only emulator instrumentation builds permit HTTP to the host loopback alias.
    if (project.hasProperty('platelabAuthEmulatorTest')) {
        sourceSets.debug.res.srcDirs += file('src/emulatorTest/res')
    }
    // A local non-debuggable package preserves the existing installation's signing identity.
    // It is still a development certificate, not a production/store signing key.
    buildTypes { release { minifyEnabled false; debuggable false; signingConfig signingConfigs.debug } }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
